kind = "web"
previewPath = "/"
title = "Doxo Migration Clone"
description = "A migration-ready bill pay web experience with provider search, bill discovery, account access, reminders, and a member dashboard."
version = "1.0.0"
id = "artifacts/doxo-migration-clone"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18150

[services.development]
run = "pnpm --filter @workspace/doxo-migration-clone run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/doxo-migration-clone", "run", "build" ]
serve = "static"
publicDir = "artifacts/doxo-migration-clone/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18150"
BASE_PATH = "/"
